name: ✨ 功能建议
description: 提出新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明场景与期望，方便评估价值。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么场景下需要这个功能？
      placeholder: 迁移 X 时，我希望……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 希望插件如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前你是如何绕过的？（可选）
